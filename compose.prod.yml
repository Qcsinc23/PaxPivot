# Production topology for the single-user pilot (PRD §14.7; ADR-005). Not for local development.
#   docker compose --env-file .env.production -f compose.prod.yml up -d --wait
# .env.production is never committed (see docs/DEPLOYMENT.md for the required keys).
services:
  proxy:
    # Only when no reverse proxy exists on the host: `--profile caddy`. Behind an existing
    # Traefik (deploy/compose.traefik.yml) this service is not started.
    profiles: ["caddy"]
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PAXPIVOT_DOMAIN: ${PAXPIVOT_DOMAIN:?set PAXPIVOT_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      web:
        condition: service_started
  web:
    image: paxpivot-web:${PAXPIVOT_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      PAXPIVOT_API_URL: http://api:8000
      PAXPIVOT_API_TOKEN: ${PAXPIVOT_API_TOKEN:?set PAXPIVOT_API_TOKEN}
      PAXPIVOT_SESSION_SECRET: ${PAXPIVOT_SESSION_SECRET:?set PAXPIVOT_SESSION_SECRET}
      PAXPIVOT_PILOT_PASSPHRASE: ${PAXPIVOT_PILOT_PASSPHRASE:?set PAXPIVOT_PILOT_PASSPHRASE}
    depends_on:
      api:
        condition: service_healthy
  api:
    image: paxpivot-api:${PAXPIVOT_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://paxpivot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/paxpivot
      REDIS_URL: redis://redis:6379/0
      PAXPIVOT_API_TOKEN: ${PAXPIVOT_API_TOKEN:?set PAXPIVOT_API_TOKEN}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: paxpivot
      POSTGRES_DB: paxpivot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U paxpivot -d paxpivot && psql -h 127.0.0.1 -U paxpivot -d paxpivot -Atc 'SELECT 1'",
        ]
      interval: 2s
      timeout: 3s
      retries: 45
  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  caddy-data:
