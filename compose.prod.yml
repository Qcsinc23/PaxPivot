# Production topology for the single-user pilot (PRD §14.7; ADR-005). Not for local development.
#   docker compose --env-file .env.production -f compose.prod.yml up -d --wait
# .env.production is never committed (see docs/DEPLOYMENT.md for the required keys).
#
# Resource limits, capability drops and logging (TASK-045) are sized for the shared pilot VPS
# (4 vCPU / 16 GB, ~7 GB available, many unrelated apps on the same Docker host). Values are
# ceilings well above observed idle usage (web ~54 MiB, api ~69 MiB, postgres ~21 MiB, redis
# ~2 MiB), not reservations, so a runaway process is capped without starving the rest of the host.
# The host's `/etc/docker/daemon.json` already rotates every container's logs the same way
# (json-file, 10m x 3); the per-service `logging:` block below repeats that only so the repo does
# not depend on host-level configuration that isn't checked in anywhere.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  proxy:
    # Only when no reverse proxy exists on the host: `--profile caddy`. Behind an existing
    # Traefik (deploy/compose.traefik.yml) this service is not started, so it is not in scope for
    # the capability hardening below (TASK-045 scope; see docs/tasks/TASK-045-ops-hardening.md).
    profiles: ["caddy"]
    image: caddy:2.9-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      PAXPIVOT_DOMAIN: ${PAXPIVOT_DOMAIN:?set PAXPIVOT_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      web:
        condition: service_healthy
  web:
    image: paxpivot-web:${PAXPIVOT_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    # Already runs as the non-root `paxpivot` user (apps/web/Dockerfile); it needs no Linux
    # capability at all (binds port 3000, no raw sockets, no filesystem ownership changes), so
    # every capability is dropped and privilege escalation via setuid/setgid binaries is blocked.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      PAXPIVOT_API_URL: http://api:8000
      PAXPIVOT_API_TOKEN: ${PAXPIVOT_API_TOKEN:?set PAXPIVOT_API_TOKEN}
      PAXPIVOT_SESSION_SECRET: ${PAXPIVOT_SESSION_SECRET:?set PAXPIVOT_SESSION_SECRET}
      PAXPIVOT_PILOT_PASSPHRASE: ${PAXPIVOT_PILOT_PASSPHRASE:?set PAXPIVOT_PILOT_PASSPHRASE}
    healthcheck:
      # No curl/wget in the node:24-slim image and this adds no packages; node's built-in
      # `fetch` probes the same host:port Next.js binds (apps/web/Dockerfile sets
      # HOSTNAME=0.0.0.0 PORT=3000). `/login` renders without calling the API server-side
      # (apps/web/app/login/page.tsx -> accessConfig() reads only env vars; see TASK-043), so
      # this reports healthy independent of api/postgres/redis. One engine-agnostic
      # interval/timeout/retries/start_period (see TASK-043 for why) is kept short enough that a
      # deploy still resolves quickly while an idle forked-Node probe every 10s costs negligible
      # CPU (TASK-043 review 1 found ~10% CPU at a 2s steady interval).
      test:
        [
          "CMD-SHELL",
          "node -e \"const p=process.env.PORT||3000;fetch('http://127.0.0.1:'+p+'/login').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
  api:
    image: paxpivot-api:${PAXPIVOT_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    # Already runs as the non-root `paxpivot` user (apps/api/Dockerfile); uvicorn/alembic need no
    # Linux capability (binds port 8000, no filesystem ownership changes), so every capability is
    # dropped and privilege escalation via setuid/setgid binaries is blocked.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgresql+psycopg://paxpivot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/paxpivot
      REDIS_URL: redis://redis:6379/0
      PAXPIVOT_API_TOKEN: ${PAXPIVOT_API_TOKEN:?set PAXPIVOT_API_TOKEN}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    # The upstream entrypoint starts as root to fix data-directory ownership, then drops to the
    # `postgres` user via gosu (docker-entrypoint.sh in postgis/postgis:16-3.5): CHOWN/FOWNER fix
    # ownership and permissions on $PGDATA, DAC_OVERRIDE lets the still-root process traverse/read
    # paths it does not own during that fixup, and SETUID/SETGID are required for gosu itself to
    # switch from uid 0 to the postgres user. No other capability is exercised. Verified against
    # both a fresh volume and an existing volume created by origin/main's compose.prod.yml (see
    # the task Handoff).
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: paxpivot
      POSTGRES_DB: paxpivot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U paxpivot -d paxpivot && psql -h 127.0.0.1 -U paxpivot -d paxpivot -Atc 'SELECT 1'",
        ]
      interval: 2s
      timeout: 3s
      retries: 45
  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *default-logging
    # Same shape as postgres above: docker-entrypoint.sh in redis:7.4.8-alpine starts as root,
    # chowns its data directory to the `redis` user (CHOWN; FOWNER/DAC_OVERRIDE cover permission
    # edge cases on that walk), then re-execs as `redis` via su-exec, which needs SETUID/SETGID to
    # change uid/gid from 0. Data is ephemeral here (`--save "" --appendonly no`, no volume
    # mounted), so this only ever runs against the image's own directory, never a persisted one.
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  caddy-data:
