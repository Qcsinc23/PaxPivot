[project]
name = "paxpivot"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["fastapi>=0.135,<0.136", "pydantic>=2.12,<3", "uvicorn>=0.41,<0.42", "sqlalchemy>=2.0,<2.1", "alembic>=1.18,<1.19", "psycopg[binary]>=3.3,<3.4", "python-dotenv>=1.2,<2", "rq>=2.6,<3"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/paxpivot"]

[dependency-groups]
dev = ["ruff==0.15.5", "mypy==1.19.1", "pytest==9.0.2", "httpx==0.28.1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/paxpivot", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires local Compose PostgreSQL/PostGIS"]
